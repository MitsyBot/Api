name: Node.js CI

on:
  push:
    branches: [ development ]
  pull_request:
    branches: [ development ]

jobs:
  test:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [14.x]
    steps:
    - uses: actions/checkout@v2
    - name: Usar nodejs ${{ matrix.node-version }}
      uses: actions/setup-node@v2
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - run: npm run start
    
  build_and_push:
    name: Build, push, and deploy image to ghcr
    runs-on: ubuntu-latest
    steps:
    - name: Logar no container registry do github
      uses: docker/login-action@v1
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Check out
      uses: actions/checkout@v2
    
    - name: Buildar a imagem
      run: |
        docker build -t ghcr.io/mitsybot/api:latest .
        docker run ghcr.io/mitsybot/api:latest
  
    - name: Enviar a imagem para o ghcr
      run: docker push ghcr.io/mitsybot/api:latest


