name: CI-CANARY

on:
  push:
    branches:
      - development

jobs:
  push_to_registry:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v2
        with: 
          submodules: true
          token: ${{ secrets.TOKEN }}

      - name: Docker builder
        uses: docker/setup-buildx-action@v1

      - name: Login GHCR
        uses: docker/login-action@v1
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.TOKEN }}

      - name: Build Docker
        uses: docker/build-push-action@v2
        with:
          context: .
          version: latest
          file: Dockerfile
          push: true
          tags: ghcr.io/mitsybot/api:latest
      - name: Enviar os arquivos para maquina da mitsy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          port: ${{ secrets.PORT }}
          script: |
            docker stop API
            docker rm API
            docker image rm ghcr.io/mitsybot/api:latest
            docker pull ghcr.io/mitsybot/api:latest
            docker run -it -d -p 1234:1234 --restart=always \
            -e PORT='1234' -e JWT_SECRET='${{ secrets.JWT_TOKEN }}' \
            -e API_TOKEN='${{ secrets.API_TOKEN }}' \
            -e AGENT='${{ secrets.AGENT }}' \
            -e DISCORD_GRPC_SERVER='${{ secrets.DISCORD_GRPC_SERVER }}' \
            -e STARTRACKER_WEBHOOK='${{ secrets.STARTRACKER_WEBHOOK }}' \
            -e BACKGROUNDS_WEBHOOK='${{ secrets.BACKGROUNDS_WEBHOOK }}' \
            -e DBL_WEBHOOK_SECRET='${{ secrets.DBL_WEBHOOK_SECRET }}' \
            -e TWITCH_SECRET='${{ secrets.TWITCH_SECRET }}' \
            -e TWITCH_CLIENT_ID='${{ secrets.TWITCH_CLIENT_ID }}' \
            -e SUGGESTION_WEBHOOK_URL='${{ secrets.SUGGESTION_WEBHOOK_URL }}' \
            -e CDN_URL='${{ secrets.CDN_URL }}' \
            -e DATABASE_URL='${{ secrets.DATABASE_URL }}' \
            -e REDIRECT_URI='${{ secrets.REDIRECT_URI }}' \
            -e CLIENT_ID='${{ secrets.CLIENT_ID }}' \
            -e CLIENT_SECRET='${{ secrets.CLIENT_SECRET }}' \
            --name API ghcr.io/mitsybot/api:latest
